services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: codeku
      POSTGRES_PASSWORD: codeku
      POSTGRES_DB: codeku
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codeku -d codeku"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  app:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgres://codeku:codeku@db:5432/codeku
      HOST: 0.0.0.0
    ports:
      - "127.0.0.1:8787:8787"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
